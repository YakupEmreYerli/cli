<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Interactive shell"><title>Interactive shell</title><defs><style>text{white-space:pre}.fl{animation:fl 7s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-12px)}}.fl2{animation:fl2 9s ease-in-out infinite alternate}@keyframes fl2{to{transform:translate(10px,8px)}}.pu{animation:pu 1.8s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.8s ease-out infinite}@keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(3.4);opacity:0}}.orb{animation:orb 5s linear infinite}@keyframes orb{to{stroke-dashoffset:-64}}.scan{animation:scan 7s ease-in-out infinite}@keyframes scan{0%,100%{stroke-opacity:0}8%{stroke-opacity:1}22%{stroke-opacity:0}}.bob{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}.mn rect{animation:mn 2.4s steps(1) infinite}.mn rect:nth-child(2){animation-delay:1.2s}@keyframes mn{0%{fill:#0E9F76}50%,100%{fill:#0B8DB5}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="#FFFFFF" stroke="#0B8DB5" stroke-width="1.8"/><rect x="7.5" y="8.5" width="17" height="15" rx="3" fill="none" stroke="#0B8DB5" stroke-width="1.7"/><path d="M7.5 12h17" stroke="#0B8DB5" stroke-width="1.4"/><path d="M10.5 15.5l2 1.6-2 1.6" fill="none" stroke="#0E9F76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g class="mn"><rect x="14.5" y="15.6" width="7" height="1.6" rx=".8" fill="#0E9F76"/><rect x="14.5" y="18.6" width="5" height="1.6" rx=".8" fill="#0B8DB5"/></g></svg>