<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="64 API operations, 65 MCP tools for AI agents, 4 enforced safety classes, 6 platforms from one binary."><title>64 API operations, 65 MCP tools for AI agents, 4 enforced safety classes, 6 platforms from one binary.</title><defs><style>@font-face{font-family:'DN';src:url(data:font/woff;base64,) format('woff')}.N{font-family:'DN',sans-serif}@font-face{font-family:'DS';src:url(data:font/woff;base64,) format('woff')}.S{font-family:'DS',sans-serif}@font-face{font-family:'DX';src:url(data:font/woff;base64,) format('woff')}.X{font-family:'DX',sans-serif}text{white-space:pre}.fl{animation:fl 7s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-12px)}}.fl2{animation:fl2 9s ease-in-out infinite alternate}@keyframes fl2{to{transform:translate(10px,8px)}}.pu{animation:pu 1.8s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.8s ease-out infinite}@keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(3.4);opacity:0}}.orb{animation:orb 5s linear infinite}@keyframes orb{to{stroke-dashoffset:-64}}.scan{animation:scan 7s ease-in-out infinite}@keyframes scan{0%,100%{stroke-opacity:0}8%{stroke-opacity:1}22%{stroke-opacity:0}}.bob{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}.rise{animation:rise 1.4s cubic-bezier(.15,.85,.25,1) both}@keyframes rise{from{transform:translateY(26px);opacity:0}}.bar{transform-box:fill-box;transform-origin:left;animation:bar 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes bar{from{transform:scaleX(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><linearGradient id="ag" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1CCC99"/><stop offset="1" stop-color="#34CFF4"/></linearGradient><linearGradient id="hb" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F2FBF8"/><stop offset="1" stop-color="#E2F5F8"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#212A4D" fill-opacity=".07"/></pattern><radialGradient id="gC"><stop offset="0" stop-color="#34CFF4" stop-opacity=".30"/><stop offset="1" stop-color="#34CFF4" stop-opacity="0"/></radialGradient><radialGradient id="gG"><stop offset="0" stop-color="#1CCC99" stop-opacity=".26"/><stop offset="1" stop-color="#1CCC99" stop-opacity="0"/></radialGradient><radialGradient id="gP"><stop offset="0" stop-color="#5138EE" stop-opacity=".16"/><stop offset="1" stop-color="#5138EE" stop-opacity="0"/></radialGradient></defs><rect x="9" y="8" width="282" height="144" rx="22" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="2"/><rect x="9" y="8" width="282" height="144" rx="22" fill="none" stroke="url(#ag)" stroke-width="2" class="scan" style="animation-delay:0.0s"/><g class="rise" style="animation-delay:0.15s"><text x="35" y="78" class="X" font-size="46" fill="url(#ag)">64</text></g><g class="rise" style="animation-delay:0.15s"><text x="106.97" y="62" class="S" font-size="17" fill="#212A4D">API operations</text></g><text x="35" y="112" class="N" font-size="13" fill="#5E6A85">every endpoint, one command each</text><rect x="35" y="126" width="230" height="5" rx="2.5" fill="#F5F7FB"/><rect x="35" y="126" width="127" height="5" rx="2.5" fill="#1CCC99" class="bar" style="animation-delay:0.15s"/><rect x="305" y="8" width="282" height="144" rx="22" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="2"/><rect x="305" y="8" width="282" height="144" rx="22" fill="none" stroke="url(#ag)" stroke-width="2" class="scan" style="animation-delay:1.4s"/><g class="rise" style="animation-delay:0.33s"><text x="331" y="78" class="X" font-size="46" fill="url(#ag)">65</text></g><g class="rise" style="animation-delay:0.33s"><text x="400.07" y="62" class="S" font-size="17" fill="#212A4D">MCP tools</text></g><text x="331" y="112" class="N" font-size="13" fill="#5E6A85">for Claude, Cursor, Codex &amp; co.</text><rect x="331" y="126" width="230" height="5" rx="2.5" fill="#F5F7FB"/><rect x="331" y="126" width="154" height="5" rx="2.5" fill="#5138EE" class="bar" style="animation-delay:0.33s"/><rect x="601" y="8" width="282" height="144" rx="22" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="2"/><rect x="601" y="8" width="282" height="144" rx="22" fill="none" stroke="url(#ag)" stroke-width="2" class="scan" style="animation-delay:2.8s"/><g class="rise" style="animation-delay:0.51s"><text x="627" y="78" class="X" font-size="46" fill="url(#ag)">4</text></g><g class="rise" style="animation-delay:0.51s"><text x="669.95" y="62" class="S" font-size="17" fill="#212A4D">safety classes</text></g><text x="627" y="112" class="N" font-size="13" fill="#5E6A85">read · write · destructive · billable</text><rect x="627" y="126" width="230" height="5" rx="2.5" fill="#F5F7FB"/><rect x="627" y="126" width="182" height="5" rx="2.5" fill="#B7791F" class="bar" style="animation-delay:0.51s"/><rect x="897" y="8" width="282" height="144" rx="22" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="2"/><rect x="897" y="8" width="282" height="144" rx="22" fill="none" stroke="url(#ag)" stroke-width="2" class="scan" style="animation-delay:4.2s"/><g class="rise" style="animation-delay:0.69s"><text x="923" y="78" class="X" font-size="46" fill="url(#ag)">6</text></g><g class="rise" style="animation-delay:0.69s"><text x="964.02" y="62" class="S" font-size="17" fill="#212A4D">platforms</text></g><text x="923" y="112" class="N" font-size="13" fill="#5E6A85">Linux · macOS · Windows · arm64</text><rect x="923" y="126" width="230" height="5" rx="2.5" fill="#F5F7FB"/><rect x="923" y="126" width="209" height="5" rx="2.5" fill="#0B8DB5" class="bar" style="animation-delay:0.69s"/></svg>