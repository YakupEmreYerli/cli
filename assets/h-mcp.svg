<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="MCP"><title>MCP</title><defs><style>text{white-space:pre}.fl{animation:fl 7s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-12px)}}.fl2{animation:fl2 9s ease-in-out infinite alternate}@keyframes fl2{to{transform:translate(10px,8px)}}.pu{animation:pu 1.8s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.8s ease-out infinite}@keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(3.4);opacity:0}}.orb{animation:orb 5s linear infinite}@keyframes orb{to{stroke-dashoffset:-64}}.scan{animation:scan 7s ease-in-out infinite}@keyframes scan{0%,100%{stroke-opacity:0}8%{stroke-opacity:1}22%{stroke-opacity:0}}.bob{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="#FFFFFF" stroke="#0B8DB5" stroke-width="1.8"/><path d="M12.5 7.5v4M19.5 7.5v4" stroke="#0B8DB5" stroke-width="1.9" stroke-linecap="round"/><path d="M10 11.5h12v3.2a6 6 0 0 1-12 0z" fill="none" stroke="#0B8DB5" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 20.7v3.8" stroke="#0E9F76" stroke-width="2" stroke-linecap="round" class="pu"/></svg>