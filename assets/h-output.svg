<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Output"><title>Output</title><defs><style>text{white-space:pre}.fl{animation:fl 7s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-12px)}}.fl2{animation:fl2 9s ease-in-out infinite alternate}@keyframes fl2{to{transform:translate(10px,8px)}}.pu{animation:pu 1.8s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.8s ease-out infinite}@keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(3.4);opacity:0}}.orb{animation:orb 5s linear infinite}@keyframes orb{to{stroke-dashoffset:-64}}.scan{animation:scan 7s ease-in-out infinite}@keyframes scan{0%,100%{stroke-opacity:0}8%{stroke-opacity:1}22%{stroke-opacity:0}}.bob{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="#FFFFFF" stroke="#0B8DB5" stroke-width="1.8"/><path d="M12 9.5c-2 0-2.5 1-2.5 2.5v1.5c0 1-.6 2-1.5 2.5.9.5 1.5 1.5 1.5 2.5V20c0 1.5.5 2.5 2.5 2.5M20 9.5c2 0 2.5 1 2.5 2.5v1.5c0 1 .6 2 1.5 2.5-.9.5-1.5 1.5-1.5 2.5V20c0 1.5-.5 2.5-2.5 2.5" fill="none" stroke="#0B8DB5" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="16" r="1.8" fill="#0E9F76" class="pu"/></svg>