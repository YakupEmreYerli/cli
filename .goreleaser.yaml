# GoReleaser v2 configuration. Run by .github/workflows/release.yml on tags (v*).
version: 2
project_name: dna

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: dna
    main: ./cmd/dna
    binary: dna
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}

archives:
  - id: dna
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Keep in sync with scripts/install.sh and scripts/install.ps1.
    name_template: "dna_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.tr.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: domainreseller
    name: cli
